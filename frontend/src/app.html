<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- maximum-scale=1 avoids iOS zoom traps on focused inputs; viewport-fit=cover
		     exposes the safe-area env() insets in standalone mode. -->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
		/>
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0b0f" />
		<meta name="description" content="Read whole websites offline — captured pages stored on your device." />

		<link rel="icon" href="%sveltekit.assets%/favicon.png?v=1" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png?v=1" />

		<!-- iOS standalone PWA chrome -->
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Reader" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
